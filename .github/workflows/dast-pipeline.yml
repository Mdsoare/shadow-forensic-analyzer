name: OWASP ZAP DAST Post-Deploy Scan

on:
  workflow_run:
    workflows: ["pages-build-deployment"] # Nome exato da action nativa do GitHub Pages
    types:
      - completed

jobs:
  dast-zap:
    name: DAST (OWASP ZAP Baseline Scan)
    runs-on: ubuntu-latest
    # Executa apenas se o deploy do Pages tiver sido concluído com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: "https://mdsoare.github.io/shadow-forensic-analyzer/"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true

      - name: Upload do Relatório HTML do DAST
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: zap-dast-html-report
          path: report_html.html
          retention-days: 14
